[workspace]
resolver = "3"
members = [
    "arca-tool",
    "auc-tool",
    "ice-tool",
    "kai-tool",
    "ocular-tool",
    "think-tool",
]

[workspace.package]
publish = true

[workspace.dependencies]
capulus = "0.2"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
ciborium = "0.2"
dialoguer = "0.12"
dirs = "6"
indicatif = "0.18"
libc = "0.2"
ed25519-dalek = { version = "3", features = ["zeroize"] }
hex = "0.4"
passless-uhid = "0.15"
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
rustix = { version = "1", features = ["fs", "mm", "net", "param", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
semver = "1"
sha2 = "0.11"
soft-fido2 = { version = "0.17", default-features = false, features = ["std"] }
soft-fido2-transport = { version = "0.17", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
webbrowser = "1"
which = "8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[patch.crates-io]
console = { git = "https://github.com/console-rs/console.git", tag = "0.16.5" }
