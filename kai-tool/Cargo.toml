[package]
name = "kai-tool"
version = "0.2.0"
edition = "2024"
publish.workspace = true
description = "Codex launcher with configurable credential rotation."
repository = "https://github.com/khoek/ferramentum/tree/master/kai-tool"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["cli", "codex", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kai"
path = "src/main.rs"

[dependencies]
capulus = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
crossterm = "0.29"
fs2 = "0.4"
hex = { workspace = true }
libc = { workspace = true }
pathdiff = "0.2"
portable-pty = "0.9"
rand = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
walkdir = "2"
which = { workspace = true }
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
